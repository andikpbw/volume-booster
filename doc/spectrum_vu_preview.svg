<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="65%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="vuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="65%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <rect width="460" height="250" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <text x="22" y="28" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F8FAFC">Real-Time Spectrum Analyzer &amp; Stereo L/R VU</text>

  <!-- Spectrum Bars Box -->
  <g transform="translate(22, 42)">
    <rect x="0" y="0" width="416" height="124" rx="12" fill="#070A12" stroke="#1E293B"/>

    <g transform="translate(18, 112) scale(1, -1)">
      <rect x="0" y="0" width="18" height="82" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="82;48;94;82" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="26" y="0" width="18" height="90" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="90;58;98;90" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="52" y="0" width="18" height="72" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="72;92;52;72" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="78" y="0" width="18" height="62" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="62;82;44;62" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect x="104" y="0" width="18" height="54" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="54;78;38;54" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="130" y="0" width="18" height="68" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="68;44;88;68" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="156" y="0" width="18" height="84" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="84;96;58;84" dur="0.88s" repeatCount="indefinite"/></rect>
      <rect x="182" y="0" width="18" height="92" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="92;54;96;92" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="208" y="0" width="18" height="74" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="74;90;48;74" dur="0.92s" repeatCount="indefinite"/></rect>
      <rect x="234" y="0" width="18" height="64" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="64;84;42;64" dur="1.12s" repeatCount="indefinite"/></rect>
      <rect x="260" y="0" width="18" height="80" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="80;50;94;80" dur="0.86s" repeatCount="indefinite"/></rect>
      <rect x="286" y="0" width="18" height="94" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="94;62;98;94" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="312" y="0" width="18" height="76" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="76;92;54;76" dur="0.94s" repeatCount="indefinite"/></rect>
      <rect x="338" y="0" width="18" height="68" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="68;46;86;68" dur="1.08s" repeatCount="indefinite"/></rect>
      <rect x="364" y="0" width="18" height="86" rx="3" fill="url(#specGrad)"><animate attributeName="height" values="86;56;94;86" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Stereo L/R Peak Meters -->
  <g transform="translate(22, 180)">
    <text x="0" y="14" font-family="monospace" font-size="12" font-weight="900" fill="#94A3B8">L</text>
    <rect x="20" y="2" width="346" height="14" rx="7" fill="#070A12"/>
    <rect x="20" y="2" width="305" height="14" rx="7" fill="url(#vuGrad)">
      <animate attributeName="width" values="250;330;275;250" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="374" y="0" width="42" height="18" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="395" y="13" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#34D399" text-anchor="middle">PEAK</text>

    <text x="0" y="42" font-family="monospace" font-size="12" font-weight="900" fill="#94A3B8">R</text>
    <rect x="20" y="30" width="346" height="14" rx="7" fill="#070A12"/>
    <rect x="20" y="30" width="292" height="14" rx="7" fill="url(#vuGrad)">
      <animate attributeName="width" values="238;318;264;238" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="374" y="28" width="42" height="18" rx="6" fill="#00F5D4" fill-opacity="0.2" stroke="#00F5D4"/>
    <text x="395" y="41" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#00F5D4" text-anchor="middle">SAFE</text>
  </g>
</svg>
