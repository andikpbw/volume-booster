<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="capGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
  </defs>

  <rect width="460" height="250" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(135, 130)">
    <!-- Harmonic Overdrive Pulse Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.45">
      <animate attributeName="r" values="70;90;70" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0.05;0.65" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Base Track -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1E293B" stroke-width="11" stroke-dasharray="339 452" transform="rotate(135)" stroke-linecap="round"/>

    <!-- Active Multi-Zone Neon Arc -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#arcGrad)" stroke-width="11" stroke-dasharray="285 452" transform="rotate(135)" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="210 452;310 452;210 452" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- 100% Unity Badge -->
    <rect x="-34" y="-98" width="68" height="16" rx="6" fill="#0F172A" stroke="#00F5D4"/>
    <text x="0" y="-87" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#00F5D4" text-anchor="middle">100% (0dB)</text>

    <!-- 3D Knob Cap -->
    <circle cx="0" cy="0" r="55" fill="url(#capGrad)" stroke="#A855F7" stroke-width="2"/>
    <rect x="-36" y="-31" width="72" height="14" rx="7" fill="#F43F5E" fill-opacity="0.22" stroke="#F43F5E" stroke-width="0.9"/>
    <text x="0" y="-21" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#FDA4AF" text-anchor="middle">TURBO BOOST</text>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="27" font-weight="900" fill="#F8FAFC" text-anchor="middle">165%</text>
    <text x="0" y="25" font-family="monospace" font-size="11" font-weight="800" fill="#00F5D4" text-anchor="middle">+7.8 dB</text>

    <!-- Rotating Pointer -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="20;82;20" dur="4s" repeatCount="indefinite"/>
      <line x1="0" y1="-39" x2="0" y2="-52" stroke="#00F5D4" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Panel Info -->
  <g transform="translate(250, 34)" font-family="system-ui, sans-serif">
    <text x="0" y="16" font-size="13.5" font-weight="800" fill="#F8FAFC">3-Zone Overdrive Rotary</text>
    <text x="0" y="34" font-size="11" fill="#94A3B8">Circular Drag • Scroll • Arrow Keys</text>

    <rect x="0" y="52" width="182" height="32" rx="10" fill="#00F5D4" fill-opacity="0.14" stroke="#00F5D4"/>
    <text x="14" y="72" font-size="11" font-weight="800" fill="#00F5D4">Safe Zone: 0% – 100% (0 dB)</text>

    <rect x="0" y="94" width="182" height="32" rx="10" fill="#A855F7" fill-opacity="0.18" stroke="#A855F7"/>
    <text x="14" y="114" font-size="11" font-weight="800" fill="#E9D5FF">Turbo Boost: 101% – 155%</text>

    <rect x="0" y="136" width="182" height="32" rx="10" fill="#F43F5E" fill-opacity="0.20" stroke="#F43F5E"/>
    <text x="14" y="156" font-size="11" font-weight="800" fill="#FFE4E6">Overdrive: 156% – 200%+</text>
  </g>
</svg>
