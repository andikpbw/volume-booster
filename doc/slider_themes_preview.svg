    <rect x="142" y="0" width="132" height="38" rx="10" fill="#18191E" stroke="#10B981"/>
    <text x="208" y="23" fill="#34D399" text-anchor="middle">studioPro()</text>

    <rect x="284" y="0" width="132" height="38" rx="10" fill="#1E293B" stroke="#38BDF8"/>
