    <line x1="208" y1="34" x2="208" y2="64" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="208" y="75" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#00F5D4" text-anchor="middle">100% UNITY (0 dB)</text>
  </g>

