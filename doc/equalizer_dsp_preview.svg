<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="460" height="250" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <text x="22" y="28" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F8FAFC">5-Band Graphic Equalizer &amp; Bass Enhancer</text>
  <rect x="366" y="12" width="72" height="22" rx="11" fill="#A855F7" fill-opacity="0.24" stroke="#A855F7"/>
  <text x="402" y="27" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#F3E8FF" text-anchor="middle">Bass+ EQ</text>

  <!-- Equalizer Curve Canvas -->
  <g transform="translate(22, 46)">
    <rect x="0" y="0" width="416" height="128" rx="12" fill="#070A12" stroke="#1E293B"/>
    <line x1="0" y1="64" x2="416" y2="64" stroke="#00F5D4" stroke-opacity="0.35" stroke-dasharray="4 4"/>

    <path d="M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18 L 416,128 L 0,128 Z" fill="url(#areaGrad)">
      <animate attributeName="d"
        values="M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18 L 416,128 L 0,128 Z;
                M 0,40 C 50,35 90,22 130,26 C 170,30 195,50 208,50 C 230,50 265,24 305,20 C 345,16 380,32 416,32 L 416,128 L 0,128 Z;
                M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18 L 416,128 L 0,128 Z"
        dur="4s" repeatCount="indefinite"/>
    </path>

    <path d="M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18" fill="none" stroke="url(#curveGrad)" stroke-width="3">
      <animate attributeName="d"
        values="M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18;
                M 0,40 C 50,35 90,22 130,26 C 170,30 195,50 208,50 C 230,50 265,24 305,20 C 345,16 380,32 416,32;
                M 0,24 C 50,20 90,34 130,38 C 170,42 195,72 208,72 C 230,72 265,38 305,28 C 345,20 380,18 416,18"
        dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bottom Enhancer Pills -->
  <g transform="translate(22, 192)" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
    <rect x="0" y="0" width="132" height="36" rx="10" fill="#1E293B" stroke="#A855F7"/>
    <text x="66" y="22" fill="#E9D5FF" text-anchor="middle">Bass Boost: 88%</text>

    <rect x="142" y="0" width="132" height="36" rx="10" fill="#1E293B" stroke="#00F5D4"/>
    <text x="208" y="22" fill="#00F5D4" text-anchor="middle">3D Spatial: 75%</text>

    <rect x="284" y="0" width="132" height="36" rx="10" fill="#10B981" fill-opacity="0.16" stroke="#10B981"/>
    <text x="350" y="22" fill="#34D399" text-anchor="middle">Limiter: ACTIVE</text>
  </g>
</svg>
